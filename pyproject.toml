[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckguard"
version = "0.1.0"
description = "Brand compliance automation for PowerPoint decks"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=0.6.23",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "playwright>=1.40",  # deckguard.visual; its tests skip cleanly without it
]
# Headless measurement of what slides actually lay out to. Optional
# because every entry point in deckguard.visual degrades to "not
# measured" rather than failing when it is absent.
visual = [
    "playwright>=1.40",
]

[project.scripts]
deckguard = "deckguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deckguard = [
    "brand_rules.yaml",
    "assets/*.png",
    "assets/*.pptx",
    # rendered offline by `python -m deckguard.thumbs`, committed because
    # the server has neither LibreOffice nor poppler
    "assets/previews/*/*.png",
    # the designer-edited artefacts: the meter's tiers and the
    # placeholder copy
    "assets/kone-design/*.json",
    # the vendored skill + the KONE photo library picture slots fall back
    # to, so a deploy with no ~/.claude/skills still renders them
    "assets/kone_deck_generator/**/*",
    "assets/kone-design/**/*",
    "assets/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
