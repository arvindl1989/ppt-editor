[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckguard"
version = "0.1.0"
description = "Brand compliance automation for PowerPoint decks"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=0.6.23",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
ai = [
    "anthropic>=0.40",
]

[project.scripts]
deckguard = "deckguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deckguard = ["brand_rules.yaml", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
