# Nixpacks' default Python provider copies only pyproject.toml into the
# build stage before running `pip install .`, which fails for this
# src/-layout package (setuptools can't find `src/` because it isn't
# copied in yet -- "error in 'egg_base' option: 'src' does not exist").
# Sidestep it entirely: install third-party deps from a flat
# requirements.txt (needs no source tree), then run uvicorn straight
# against the checked-out source via PYTHONPATH instead of pip-installing
# our own package.
[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "pip install --no-cache-dir --upgrade pip",
  "pip install --no-cache-dir -r requirements.txt",
]

[start]
cmd = "PYTHONPATH=/app/src uvicorn deckguard.web:app --host 0.0.0.0 --port $PORT"
